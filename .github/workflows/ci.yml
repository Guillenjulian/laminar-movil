# CI de laminar-movil.
#
# Corre en cada pull request y en cada push a main. Flujo:
#   1. npm ci con la versión de Node de .node-version (cache de npm).
#   2. lint y format:check (rápidos, fallan primero).
#   3. build de producción (dist/), que necesitan test:motor y test:app.
#   4. Chromium: se instala con la versión de playwright-core del lock y su
#      ruta se pasa a los scripts en CHROMIUM_PATH (la leen probar-motor y probar-app).
#   5. Las suites: transformar y formatos (Node), motor y app (Chromium), y contratos.
# Una corrida nueva del mismo PR cancela la anterior.
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Instalar dependencias
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Build
              run: npm run build

            - name: Instalar Chromium
              run: |
                  npx playwright-core install --with-deps chromium
                  echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

            - name: Test transformar
              run: npm run test:transformar

            - name: Test formatos
              run: npm run test:formatos

            - name: Test torres
              run: npm run test:torres

            - name: Test cambios
              run: npm run test:cambios

            - name: Test piezas
              run: npm run test:piezas

            - name: Test recorridos
              run: npm run test:recorridos

            - name: Test motor
              run: npm run test:motor

            - name: Test app
              run: npm run test:app

            - name: Test contratos
              run: npm run test:contratos
