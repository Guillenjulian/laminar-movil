<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Prueba del motor</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 16px;
            }
            button,
            select {
                font-size: 1.1rem;
                padding: 10px 14px;
                margin: 4px 4px 4px 0;
            }
            pre {
                background: #eee;
                padding: 8px;
                max-height: 50vh;
                overflow: auto;
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <!-- Página de diagnóstico: lamina mallas de prueba con los perfiles reales, sin la UI. -->
        <h1>Prueba del motor</h1>
        <p>
            <select id="calidad">
                <option value="rapido">Rápido</option>
                <option value="normal" selected>Normal</option>
                <option value="detalle">Detalle</option>
            </select>
            <label><input type="checkbox" id="soportes" /> Soportes</label>
        </p>
        <p>
            <button data-caso="cubo">Cubo 20 mm</button>
            <button data-caso="te">"T" con voladizo</button>
            <button data-caso="esfera">Esfera de 1,2 M triángulos</button>
            <button data-caso="esferaChica">Esfera chica</button>
            <button data-caso="tubo">Tubo con agujero</button>
        </p>
        <p id="estado">Listo para probar.</p>
        <pre id="salida"></pre>
        <script type="module">
            import { laminar, torreAStl } from './src/motor/motor.js';
            import { armarTorre, configuracionDeTorre } from './src/perfiles/torres.js';
            import {
                armarConfiguracion,
                listaImpresoras,
                buscarImpresora,
                ponerImpresorasPropias,
            } from './src/perfiles/perfiles.js';
            window.impresoras = listaImpresoras().map(i => ({ id: i.id, nombre: i.nombre, estado: i.estado }));
            window.buscarImpresora = buscarImpresora;
            // Para probar con impresoras "propias" (ej. una con límites de temperatura bajos).
            window.ponerImpresorasPropias = ponerImpresorasPropias;
            import { maxTriangulos } from './src/config.js';
            import { esfera, te, tubo } from './src/prueba/mallas.js';

            const estado = document.getElementById('estado');
            const salida = document.getElementById('salida');

            async function obtenerSTL(caso) {
                if (caso === 'esfera') return esfera();
                if (caso === 'esferaChica') return esfera(10, 30); // 20 mm, ~3600 triángulos
                if (caso === 'tubo') return tubo();
                if (caso === 'te') return te();
                return (await fetch('ejemplos/cubo-20mm.stl')).arrayBuffer();
            }

            // Expuesta en window para las pruebas automáticas (scripts/probar-motor.mjs).
            window.probar = async ({
                caso = 'cubo',
                impresoraId = 'creality-ender-3-v3-se',
                calidad = 'normal',
                material = 'pla',
                soportes = false,
                personal = {},
                limite,
                transformacion,
                cambios,
                stlBase64, // un STL ya armado (lo usan las pruebas que necesitan una malla propia)
            } = {}) => {
                const stl = stlBase64
                    ? Uint8Array.from(atob(stlBase64), c => c.charCodeAt(0)).buffer
                    : await obtenerSTL(caso);
                const { dispositivo, proceso, avisos } = armarConfiguracion({
                    impresoraId,
                    calidad,
                    material,
                    soportes,
                    personal,
                    cambios,
                });
                const inicio = performance.now();
                const r = await laminar({
                    stl,
                    dispositivo,
                    proceso,
                    maxTriangulos: limite ?? maxTriangulos(),
                    transformacion,
                    alProgresar: (etapa, valor) => (estado.textContent = `${etapa} ${Math.round(valor * 100)}%`),
                });
                r.ms = Math.round(performance.now() - inicio);
                r.avisos = avisos;
                return r;
            };

            // Torre de calibración: su configuración (perfiles/torres.js importa JSON, que Node no carga sin más).
            // Con el hotendMax de la impresora, como lo hace la app.
            window.configTorre = ({ impresoraId = 'creality-ender-3-v3-se', ...op }) => {
                const torre = armarTorre({ ...op, hotendMax: buscarImpresora(impresoraId).limites?.hotendMax });
                return { torre, config: configuracionDeTorre(torre) };
            };

            // Torre de calibración en el worker (ADR 0002, T7). Con `cancelar` aborta enseguida.
            window.torreStl = async (op, cancelar) => {
                const control = new AbortController();
                const p = torreAStl(op, { signal: control.signal });
                if (cancelar) control.abort();
                try {
                    const { stl } = await p;
                    const bytes = new Uint8Array(stl);
                    const base64 = btoa(Array.from(bytes, b => String.fromCharCode(b)).join(''));
                    return { bytes: bytes.length, triangulos: new DataView(stl).getUint32(80, true), base64 };
                } catch (err) {
                    return { error: err.name };
                }
            };

            // ADR 0003 (T0): varios widgets con `track.pos` distintos en el Kiri real. Se usa el worker original de
            // Kiri con su propio protocolo ({ task, data, seq }) y se arma el mismo flujo que laminador.worker.js:
            // clear, sync por widget, rotate, slicePre, slice por id, slicePost, prepare, export.
            // `piezas`: [{ caso | stlBase64, pos: { x, y } }]. Devuelve el G-code.
            window.probarPiezas = async ({
                piezas,
                impresoraId = 'creality-ender-3-v3-se',
                calidad = 'normal',
                material = 'pla',
                soportes = false,
                personal = {},
            }) => {
                const { leerSTL } = await import('./src/motor/stl.js');
                await import('./vendor/kiri/src/add/array.js');
                await import('./vendor/kiri/src/add/class.js');
                const { conf } = await import('./vendor/kiri/src/kiri/app/conf/defaults.js');
                const worker = new Worker(new URL('./prueba-piezas.worker.js', import.meta.url), {
                    type: 'module',
                });
                let seq = 0;
                const call = (task, data, alAvanzar = () => {}) =>
                    new Promise((ok, mal) => {
                        const mi = ++seq;
                        worker.onerror = e => mal(new Error(e.message));
                        const prev = worker.onmessage;
                        worker.onmessage = e => {
                            const m = e.data;
                            if (m.seq !== mi) return;
                            if (m.data && m.data.error) return mal(new Error(m.data.error));
                            if (m.done) ok(m.data);
                            else alAvanzar(m.data);
                        };
                        worker.postMessage({ task, data, seq: mi, time: performance.now() });
                    });
                const { dispositivo, proceso } = armarConfiguracion({
                    impresoraId,
                    calidad,
                    material,
                    soportes,
                    personal,
                });
                const base = conf.template;
                const settings = {
                    mode: 'FDM',
                    controller: { ...JSON.parse(JSON.stringify(base.controller)), threaded: false },
                    render: false,
                    filter: { FDM: 'internal' },
                    device: { ...JSON.parse(JSON.stringify(conf.defaults.fdm.d)), ...dispositivo },
                    process: { ...JSON.parse(JSON.stringify(conf.defaults.fdm.p)), ...proceso },
                    widget: {},
                    time: Date.now(),
                };
                try {
                    await call('clear', {});
                    const ids = [];
                    for (const [i, p] of piezas.entries()) {
                        const buf = p.stlBase64
                            ? Uint8Array.from(atob(p.stlBase64), c => c.charCodeAt(0)).buffer
                            : await obtenerSTL(p.caso);
                        const v = leerSTL(buf);
                        // Igual que centrar() del worker: centro de la caja en X/Y = 0, base en Z = 0.
                        const mn = [Infinity, Infinity, Infinity],
                            mx = [-Infinity, -Infinity, -Infinity];
                        for (let k = 0; k < v.length; k += 3)
                            for (let a = 0; a < 3; a++) {
                                mn[a] = Math.min(mn[a], v[k + a]);
                                mx[a] = Math.max(mx[a], v[k + a]);
                            }
                        const c = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, mn[2]];
                        for (let k = 0; k < v.length; k += 3) for (let a = 0; a < 3; a++) v[k + a] -= c[a];
                        const t = { x: mx[0] - mn[0], y: mx[1] - mn[1], z: mx[2] - mn[2] };
                        const id = 'pieza' + (i + 1);
                        ids.push(id);
                        settings.widget[id] = {};
                        await call('sync', {
                            id,
                            group: id,
                            vertices: v,
                            meta: {},
                            anno: {},
                            track: {
                                box: { w: t.x, h: t.y, d: t.z },
                                pos: { x: p.pos.x, y: p.pos.y, z: 0 },
                                scale: { x: 1, y: 1, z: 1 },
                                rot: { x: 0, y: 0, z: 0 },
                                top: t.z,
                            },
                        });
                    }
                    await call('rotate', { settings });
                    await call('slicePre', { settings });
                    for (const id of ids) await call('slice', { id, settings });
                    await call('slicePost', { settings });
                    await call('prepare', { settings });
                    const lineas = [];
                    await call('export', { settings }, d => {
                        if (d && d.line) lineas.push(d.line);
                    });
                    return { gcode: lineas.join('\n'), dispositivo };
                } finally {
                    worker.terminate();
                }
            };

            document.querySelectorAll('[data-caso]').forEach(
                boton =>
                    (boton.onclick = async () => {
                        try {
                            const r = await window.probar({
                                caso: boton.dataset.caso,
                                calidad: document.getElementById('calidad').value,
                                soportes: document.getElementById('soportes').checked,
                            });
                            estado.textContent = `OK en ${r.ms} ms — ${JSON.stringify(r.info)}`;
                            salida.textContent = r.gcode.split('\n').slice(0, 80).join('\n');
                        } catch (err) {
                            estado.textContent = 'Error: ' + err.message;
                        }
                    }),
            );
        </script>
    </body>
</html>
